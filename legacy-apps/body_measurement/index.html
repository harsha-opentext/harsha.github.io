<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Body Measurements</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="csv.js"></script>
  <script src="history.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <nav class="bm-header">
    <div style="font-weight:700">⚖️ Body Measurements</div>
    <div style="display:flex;gap:8px;align-items:center">
      <button id="bm-refresh-btn" class="icon-btn">🔄</button>
      <button id="bm-import-csv-btn" class="btn-secondary" onclick="bm_openCsvImport()">📄 Import CSV</button>
      <button class="icon-btn" onclick="window.location.href='settings.html'" title="Settings">⚙️</button>
    </div>
  </nav>

  <div class="bm-content">
    <div class="bm-form">
      <form id="bm-form" onsubmit="event.preventDefault(); bm_handleAddEntry();">
        <label>Weight (kg)</label>
        <input id="bm-weight" type="number" step="0.1" placeholder="e.g. 72.5" required>
        <label>Date</label>
        <input id="bm-date" type="date" value="">
        <label>Body Fat % (optional)</label>
        <input id="bm-bodyfat" type="number" step="0.1" placeholder="e.g. 18.2">
        <label>BMI (optional)</label>
        <input id="bm-bmi" type="number" step="0.1" placeholder="e.g. 22.7">
        <label>Muscle Mass (kg) (optional)</label>
        <input id="bm-muscle" type="number" step="0.1" placeholder="e.g. 30.2">
        <label>Fat Mass (kg) (optional)</label>
        <input id="bm-fatmass" type="number" step="0.1" placeholder="e.g. 14.3">
        <div class="bm-actions">
          <button id="bm-add-btn" type="button" class="btn-primary">✅ Add</button>
          <button type="reset" class="btn-secondary">Reset</button>
        </div>
      </form>
    </div>

    <div id="bm-list"></div>
  </div>
  
  

  <!-- Bottom navigation (tracker style) -->
  <div class="bottom-nav tracker-nav">
    <div class="nav-links">
      <button id="nav-apps" type="button" class="nav-btn nav-apps-btn" onclick="window.location.href='../index.html'">
        <span class="icon">←</span>
        <span class="label">Apps</span>
      </button>
      <button id="nav-home" type="button" class="nav-btn active" onclick="/* noop - already on main */">
        <span class="icon">⚖️</span>
        <span class="label">Measure</span>
      </button>
      <button id="nav-history" type="button" class="nav-btn" onclick="window.location.href='history.html'">
        <span class="icon">📜</span>
        <span class="label">History</span>
      </button>
      <button id="nav-settings" type="button" class="nav-btn" onclick="window.location.href='settings.html'">
        <span class="icon">⚙️</span>
        <span class="label">Settings</span>
      </button>
      <button id="nav-logs" type="button" class="nav-btn" onclick="bm_toggleLogs()">
        <span class="icon">🔍</span>
        <span class="label">Logs</span>
      </button>
    </div>
  </div>

  <!-- Log Panel -->
  <div id="log-panel" aria-hidden="true" class="bm-log-panel">
    <div class="bm-log-header">
      <div style="font-weight:700">Logs</div>
      <div style="display:flex;gap:8px"><button class="btn-secondary" onclick="document.getElementById('log-panel').setAttribute('aria-hidden','true')">Close</button></div>
    </div>
    <div id="bm-log-list" class="bm-log-list"></div>
  </div>

  <!-- CSV Import Modal -->
  <div id="bm-csv-modal" class="bm-modal" style="display: none;">
    <div class="bm-modal-content" style="max-width:720px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <h2>📄 Import from CSV</h2>
        <button onclick="bm_closeCsvImport()" class="icon-btn">✕</button>
      </div>
      <div style="display:flex;gap:12px;flex-direction:column;">
        <div id="bm-csv-input-section">
          <p style="color:var(--text-secondary); margin-bottom: 12px;">Paste your CSV data below. Expected format:</p>
          <div style="display:flex; gap: 8px; align-items: flex-start;">
            <pre id="bm-example-csv" style="background: var(--bg); padding: 12px; border-radius: 8px; font-size: 12px; color:var(--text-secondary);">date,weight,bodyFat,bmi,muscleMass,fatMass
2026-01-15,72.5,18.2,22.7,31.2,13.2
2026-01-16,72.1,18.0,22.6,31.1,13.0</pre>
            <button class="btn-secondary" style="height:40px;margin-top:8px;" onclick="bm_copyExampleCsv()">📋 Copy</button>
          </div>
          <textarea id="bm-csv-input" placeholder="Paste CSV data here..." style="width:100%; height:200px; padding:12px; border:1px solid var(--border); border-radius:8px; font-family:monospace; font-size:13px; margin:12px 0;"></textarea>
          <button class="btn-primary" onclick="bm_parseCsv()" style="width:100%;">🔍 Parse & Preview</button>
        </div>

        <div id="bm-csv-preview-section" style="display:none;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:12px;background:var(--bg);border-radius:12px;">
            <div>
              <h3 style="margin:0 0 4px 0; font-size:18px;">Preview</h3>
              <p style="margin:0;color:var(--text-secondary);font-size:14px;"><span id="bm-csv-count">0</span> entries ready to import</p>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn-secondary" onclick="bm_backToCsvInput()">← Back</button>
              <button class="btn-primary" onclick="bm_importCsvEntries()">✅ Import All</button>
            </div>
          </div>
          <div id="bm-csv-preview-list" style="max-height:400px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; padding:12px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="bm-settings-modal" class="bm-modal" style="display:none;">
    <div class="bm-modal-content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <h3>🔐 GitHub Configuration</h3>
        <button id="bm-close-settings" class="icon-btn">✕</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <label>Personal Access Token</label>
        <input id="bm-cfg-token" type="password" placeholder="ghp_...">
        <label>Repository Path</label>
        <input id="bm-cfg-repo" type="text" placeholder="username/repo-name">
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
          <button id="bm-save-settings" class="btn-primary">💾 Save</button>
          <button id="bm-cancel-settings" class="btn-secondary">Cancel</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
